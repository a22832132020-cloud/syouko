<body>
  <div class="wrap">
    <header class="top">
      <div><h1>PIXEL COMMANDO — SYOUKO ASSAULT</h1><p class="hint">WASD / 方向鍵移動與瞄準，Space/Z/J 射擊，K/↑/W 跳躍，P/Esc 暫停。輸入創作者代碼後按 G 可切換無敵。</p></div>
      <div class="debug"><input id="creatorCode" placeholder="Creator code" aria-label="Creator code"><button id="unlockDebug" class="btn">解鎖除錯</button><button id="musicButton" class="btn">音樂 OFF</button><button id="startButton" class="btn">開始任務</button></div>
    </header>
    <section id="menu" class="pixel screen"><h2>角色選擇</h2><button id="maleSelect" class="btn">REX // 男突擊兵</button> <button id="femaleSelect" class="btn">NOVA // 女突擊兵</button><p id="chosenText" class="hint">目前：REX。每個關卡都有不同平台、敵人節奏、補給箱與 8-bit 熱血旋律。</p></section>
    <section id="game" class="pixel shell hidden"><canvas id="gameCanvas" width="960" height="540" tabindex="0"></canvas><div id="pauseOverlay" class="overlay hidden"><div><h2>PAUSED</h2><p class="hint">按 P 或 Esc 繼續</p></div></div><div id="endOverlay" class="overlay hidden"><div><h2 id="endTitle"></h2><p id="endCopy" class="hint"></p><button id="restartButton" class="btn">返回選單</button></div></div><div class="touch" aria-label="mobile controls"><div class="pad"><button class="up" data-hold="w">▲</button><button class="down" data-hold="s">▼</button><button class="left" data-hold="a">◀</button><button class="right" data-hold="d">▶</button></div><button class="fire" data-hold="j">攻擊</button><button class="jump" data-tap="jump">跳躍</button><button class="shield" data-tap="shield">盾</button><button class="pause" data-tap="pause">暫停</button></div></section>
  </div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),W=960,H=540,keys={};let chosen='male',running=false,paused=false,last=0,player,enemies=[],shots=[],capsules=[],particles=[],boss=null,cameraX=0,cameraY=380,score=0,spawnClock=0,bossStarted=false,debugUnlocked=false,godMode=false,shootCooldown=0,audioCtx=null,musicTimer=null,musicOn=false,noteIndex=0,currentLevel=0;
const worldWidth=9800,GRAV=1450,MAX_ENEMIES=5;
const levels=[{name:'霓虹山脈',start:0,end:3100,sky:'#0c2947',accent:'#c9f54b',spawn:.9,melody:[262,330,392,523,392,330,294,370],bass:[131,147,175,147],types:['patrol','patrol','heavy']},{name:'廢都天橋',start:3100,end:6500,sky:'#23154a',accent:'#4eeaff',spawn:.75,melody:[294,370,440,587,440,370,330,494],bass:[147,165,196,165],types:['patrol','heavy','turret']},{name:'天穹要塞',start:6500,end:9800,sky:'#351421',accent:'#ff5a54',spawn:.62,melody:[330,392,494,659,587,494,392,330],bass:[165,196,247,196],types:['heavy','turret','patrol']}];
const platforms=[{x:-100,y:900,w:1300,h:90},{x:1280,y:900,w:920,h:90},{x:2290,y:900,w:940,h:90},{x:3340,y:900,w:930,h:90},{x:4380,y:900,w:1000,h:90},{x:5500,y:900,w:4380,h:90},{x:220,y:780,w:220,h:22},{x:590,y:700,w:190,h:22},{x:900,y:620,w:190,h:22},{x:1210,y:785,w:215,h:22},{x:1470,y:690,w:205,h:22},{x:1770,y:590,w:230,h:22},{x:2020,y:475,w:210,h:22},{x:2360,y:790,w:180,h:22},{x:2660,y:700,w:210,h:22},{x:2950,y:610,w:205,h:22},{x:3170,y:500,w:260,h:22},{x:3500,y:790,w:215,h:22},{x:3790,y:690,w:200,h:22},{x:4020,y:570,w:220,h:22},{x:4420,y:780,w:230,h:22},{x:4730,y:665,w:210,h:22},{x:5010,y:545,w:240,h:22},{x:5290,y:420,w:260,h:22},{x:5650,y:780,w:260,h:22},{x:5940,y:665,w:230,h:22},{x:6240,y:535,w:220,h:22},{x:6510,y:400,w:290,h:22},{x:6860,y:550,w:285,h:22},{x:7220,y:680,w:310,h:22},{x:7560,y:790,w:660,h:22},{x:8280,y:660,w:300,h:22},{x:8700,y:530,w:270,h:22},{x:9100,y:710,w:420,h:22}];
const capsulePoints=[{x:700,y:655,weapon:'火焰槍'},{x:2120,y:430,weapon:'散彈槍'},{x:3360,y:455,weapon:'追蹤彈'},{x:5410,y:375,weapon:'防護罩'},{x:6690,y:355,weapon:'雷射槍'},{x:8880,y:485,weapon:'追蹤彈'}];
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function sx(x){return x-cameraX}function sy(y){return y-cameraY}function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function levelAt(x){return levels.findIndex(l=>x>=l.start&&x<l.end)}function curLevel(){return levels[Math.max(0,levelAt(player?.x||0))]||levels[0]}
function resetGame(){player={x:80,y:840,w:22,h:48,vx:0,vy:0,facing:1,hp:100,weapon:'豆彈',shield:0,inv:0,onGround:false,crouch:false,jumps:2,walk:0};enemies=[];shots=[];particles=[];boss=null;capsules=capsulePoints.map(c=>({...c,w:34,h:24,hp:2,opened:false,collected:false}));cameraX=0;cameraY=380;score=0;spawnClock=0;bossStarted=false;shootCooldown=0;currentLevel=0;running=true;paused=false;last=0;document.getElementById('endOverlay').classList.add('hidden');document.getElementById('pauseOverlay').classList.add('hidden');canvas.focus();requestAnimationFrame(loop);}
function land(e,oldY){let landed=false;e.platform=null;platforms.forEach(p=>{const oldBottom=oldY+e.h,bottom=e.y+e.h;if(e.vy>=0&&e.x+e.w-4>p.x&&e.x+4<p.x+p.w&&oldBottom<=p.y+4&&bottom>=p.y){e.y=p.y-e.h;e.vy=0;e.platform=p;landed=true}});return landed}
function jump(){if(!running||paused||player.jumps<=0||player.crouch)return;player.vy=player.jumps===2?-640:-580;player.jumps--;player.onGround=false;beep(720,.04,'square',.03)}
function aim(){const up=keys.w||keys.arrowup,down=keys.s||keys.arrowdown,moving=keys.a||keys.arrowleft||keys.d||keys.arrowright;if(up&&!down)return moving?'diagup':'up';if(down&&!up)return moving?'diagdown':'down';return'front'}
function shoot(){if(!running||paused||shootCooldown>0)return;let d=aim(),dx=player.facing,dy=0;if(d==='up'){dx=0;dy=-1}if(d==='down'){dx=0;dy=1}if(d==='diagup')dy=-.7;if(d==='diagdown')dy=.7;const px=player.x+12+(dx>0?16:dx<0?-7:0),py=player.y+(player.crouch?31:20)+(dy<0?-8:0),base={x:px,y:py,w:8,h:5,vx:dx*660,vy:dy*660,dmg:12,life:.8,type:'bean'};if(player.weapon==='追蹤彈'){shots.push({...base,w:12,h:7,vx:dx*390,vy:dy*240,dmg:32,life:1.6,type:'homing'});shootCooldown=.38}else if(player.weapon==='防護罩'){player.shield=4;shootCooldown=.7;beep(210,.12,'triangle',.05)}else if(player.weapon==='散彈槍'){[-.22,-.1,0,.1,.22].forEach(a=>shots.push({...base,w:7,h:4,vx:(dx-a*dy)*570,vy:(dy+a*dx)*570,dmg:18,life:.55,type:'spread'}));shootCooldown=.34}else if(player.weapon==='火焰槍'){shots.push({...base,w:18,h:9,vx:dx*340,vy:dy*340,dmg:20,life:.8,type:'fire'});shootCooldown=.16}else if(player.weapon==='雷射槍'){shots.push({...base,w:17,h:4,vx:dx*920,vy:dy*920,dmg:34,life:.32,type:'laser'});shootCooldown=.2}else{shots.push(base);shootCooldown=.1}beep(player.weapon==='雷射槍'?780:430,.03,'square',.02)}
function spawnEnemy(){if(enemies.length>=MAX_ENEMIES)return;const l=curLevel(),choices=platforms.filter(p=>p.x>cameraX+420&&p.x<cameraX+W+520&&p.y<900);if(!choices.length)return;const p=choices[Math.floor(Math.random()*choices.length)],type=l.types[Math.floor(Math.random()*l.types.length)],turret=type==='turret';enemies.push({type,x:p.x+30+Math.random()*Math.max(1,p.w-70),y:p.y-(turret?36:42),w:turret?32: type==='heavy'?30:24,h:turret?36:42,vx:0,vy:0,hp:turret?70:type==='heavy'?90:38,speed:turret?0:type==='heavy'?42:92,dir:Math.random()<.5?-1:1,cool:.7+Math.random(),platform:p,landed:true})}
function hurt(amount){if(godMode||player.shield>0||player.inv>0)return;player.hp-=amount;player.inv=.65;beep(120,.09,'sawtooth',.04)}
function update(dt){if(paused)return;shootCooldown=Math.max(0,shootCooldown-dt);player.inv=Math.max(0,player.inv-dt);player.shield=Math.max(0,player.shield-dt);currentLevel=levelAt(player.x);const move=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);player.vx=move*(player.crouch?125:235);if(move)player.facing=move>0?1:-1;player.crouch=!!(keys.s||keys.arrowdown)&&player.onGround;if(keys.j||keys.z||keys[' '])shoot();const oldY=player.y;player.vy+=GRAV*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;player.walk+=Math.abs(player.vx)*dt*.08;player.onGround=land(player,oldY);if(player.onGround)player.jumps=2;player.x=Math.max(5,player.x);if(player.y>1050&&!godMode)player.hp=0;cameraX+=(Math.max(0,Math.min(worldWidth-W+60,player.x-210))-cameraX)*Math.min(1,dt*4.5);cameraY+=(Math.max(0,Math.min(450,player.y-250))-cameraY)*Math.min(1,dt*3.4);spawnClock+=dt;if(!bossStarted&&player.x>480&&player.x<worldWidth-950&&spawnClock>curLevel().spawn){spawnClock=0;spawnEnemy()}if(!bossStarted&&player.x>worldWidth-850){bossStarted=true;boss={x:worldWidth-500,y:695,w:118,h:145,hp:1300,maxHp:1300,cool:1.2,phase:0}}enemies.forEach(e=>{e.cool-=dt;if(!e.platform){e.vy+=GRAV*dt;e.y+=e.vy*dt;land(e,e.y-e.vy*dt)}else if(e.type!=='turret'){e.x+=e.dir*e.speed*dt;const left=e.platform.x+6,right=e.platform.x+e.platform.w-e.w-6;if(e.x<=left||e.x>=right){e.x=Math.max(left,Math.min(right,e.x));e.dir*=-1}}if(e.cool<=0&&Math.abs(e.x-player.x)<560){const dx=player.x-e.x,dy=player.y-e.y,mag=Math.max(1,Math.hypot(dx,dy));shots.push({x:e.x+(dx>0?e.w:0),y:e.y+e.h*.45,w:e.type==='heavy'?10:7,h:5,vx:dx/mag*(e.type==='heavy'?330:285),vy:dy/mag*(e.type==='heavy'?330:285),dmg:e.type==='heavy'?22:13,life:2,type:'enemy'});e.cool=e.type==='turret'?.75:e.type==='heavy'?1.4:1.05}if(overlap(player,e))hurt(e.type==='heavy'?22:14)});if(boss){boss.phase+=dt;boss.cool-=dt;boss.x=worldWidth-505+Math.sin(boss.phase*.6)*45;if(boss.cool<=0){[-.34,-.17,0,.17,.34].forEach(a=>shots.push({x:boss.x,y:boss.y+55,w:11,h:6,vx:-280,vy:a*390,dmg:15,life:3,type:'enemy'}));boss.cool=.82}if(overlap(player,boss))hurt(24)}shots.forEach(s=>{s.life-=dt;if(s.type==='homing'){const target=enemies.find(e=>e.hp>0)||boss;if(target){const dx=target.x-s.x,dy=target.y-s.y,mag=Math.max(1,Math.hypot(dx,dy));s.vx+=dx/mag*420*dt;s.vy+=dy/mag*420*dt}}s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.type==='enemy'&&overlap(s,player)){hurt(s.dmg);s.life=0}if(s.type!=='enemy'){capsules.forEach(c=>{if(!c.opened&&overlap(s,c)){c.hp--;s.life=0;if(c.hp<=0){c.opened=true;score+=150;beep(900,.08,'square',.04)}}});enemies.forEach(e=>{if(e.hp>0&&overlap(s,e)){e.hp-=s.dmg;if(s.type!=='laser')s.life=0;if(e.hp<=0){score+=e.type==='turret'?250:e.type==='heavy'?180:100;beep(90,.08,'sawtooth',.05)}}});if(boss&&overlap(s,boss)){boss.hp-=s.dmg;if(s.type!=='laser')s.life=0}}});enemies=enemies.filter(e=>e.hp>0&&e.x>cameraX-140);shots=shots.filter(s=>s.life>0&&s.x>cameraX-90&&s.x<cameraX+W+140&&s.y>cameraY-100&&s.y<cameraY+H+100);capsules.forEach(c=>{if(c.opened&&!c.collected&&overlap(player,c)){player.weapon=c.weapon;c.collected=true;score+=300;beep(1040,.12,'square',.05)}});if(boss&&boss.hp<=0){score+=5000;boss=null;finish(true)}if(player.hp<=0)finish(false)}
function finish(win){running=false;document.getElementById('endOverlay').classList.remove('hidden');document.getElementById('endTitle').textContent=win?'MISSION COMPLETE':'SIGNAL LOST';document.getElementById('endCopy').textContent=win?`最終得分：${score}。你已突破三個特色關卡並摧毀天穹要塞。`:`最終得分：${score}。善用平台巡邏節奏、追蹤彈與防護罩再次突擊。`}
function drawBg(){const l=curLevel();rect(0,0,W,H,'#08172b');rect(0,0,W,H*.55,l.sky);for(let i=0;i<8;i++){let x=(i*180-cameraX*.12)%1200;if(x<0)x+=1200;rect(x,260-cameraY*.05,130,60,'#102f42');rect(x+40,220-cameraY*.05,90,100,'#153a52')}for(let i=0;i<12;i++){let x=(i*110-cameraX*.25)%1100;if(x<0)x+=1100;rect(x,80+(i%3)*35-cameraY*.03,54,12,'#d6fbff');rect(x+12,68+(i%3)*35-cameraY*.03,34,10,'#d6fbff')}for(let i=0;i<18;i++){let x=(i*101-cameraX*.55)%1100;if(x<0)x+=1100;rect(x,H-125,35,125,'#102a38');rect(x-12,H-145,60,18,l.accent)}}
function drawPlatforms(){platforms.forEach(p=>{const x=sx(p.x),y=sy(p.y);if(x+p.w<0||x>W||y>H||y+p.h<0)return;rect(x,y,p.w,p.h,'#1b3740');rect(x,y,p.w,7,curLevel().accent);for(let n=8;n<p.w;n+=27)rect(x+n,y+16,15,3,'#416256')})}
function drawPlayer(){if(player.inv>0&&Math.floor(player.inv*16)%2===0)return;const x=sx(player.x),y=sy(player.y),suit=chosen==='female'?'#dd4169':'#2d7fbd',hair=chosen==='female'?'#f15578':'#a55e40';rect(x+7,y,13,9,hair);rect(x+5,y+9,18,17,'#e7b57d');rect(x+6,y+26,18,16,suit);rect(x+2,y+29,6,14,suit);if(chosen==='female')rect(x+2,y+10,5,22,hair);rect(x+(player.facing>0?21:-12),y+20,22,5,'#b8f7fa');rect(x+6,y+42,7,6,'#28384e');rect(x+18,y+42,7,6,'#28384e');if(player.shield>0){ctx.strokeStyle='#4eeaff';ctx.lineWidth=3;ctx.strokeRect(x-6,y-7,player.w+12,player.h+14)}}
function drawEnemy(e){const x=sx(e.x),y=sy(e.y);if(e.type==='turret'){rect(x-5,y+20,42,15,'#5b534b');rect(x+20,y+12,28,6,'#b7eefa');rect(x+3,y+2,24,23,'#83613f');rect(x+9,y+8,8,6,'#fff1a0');return}rect(x+5,y,14,9,e.type==='heavy'?'#7d5364':'#9e4050');rect(x+3,y+9,e.w-5,19,e.type==='heavy'?'#6d5268':'#bf4c50');rect(x+5,y+13,7,4,'#fff1a0');rect(x+18,y+16,14,5,'#a9f2f5');rect(x+4,y+28,6,14,'#273546');rect(x+16,y+28,6,14,'#273546')}
function drawHUD(){rect(12,12,385,88,'#061019');ctx.strokeStyle='#7deeff';ctx.strokeRect(12,12,385,88);ctx.font='bold 11px Courier New';ctx.fillStyle='#dffeff';ctx.fillText((chosen==='female'?'NOVA':'REX')+' // '+curLevel().name,24,32);ctx.fillStyle='#ff6971';ctx.fillText('HP',24,54);rect(54,45,132,11,'#411924');rect(54,45,132*Math.max(0,player.hp)/100,11,godMode?'#c9f54b':'#ff5a54');ctx.fillStyle='#c9f54b';ctx.fillText(player.weapon+(godMode?' // GOD':''),24,78);ctx.fillStyle='#dffeff';ctx.fillText('SCORE '+String(score).padStart(6,'0'),W-190,28);ctx.fillText('ENEMY '+enemies.length+'/'+MAX_ENEMIES,W-190,50);ctx.fillText('P/Esc PAUSE',W-190,72);if(boss){rect(W/2-220,14,440,25,'#1b0b18');ctx.strokeStyle='#ffb1b9';ctx.strokeRect(W/2-220,14,440,25);rect(W/2-216,18,432*(boss.hp/boss.maxHp),17,'#e74f57')}}
function draw(){ctx.clearRect(0,0,W,H);drawBg();drawPlatforms();capsules.forEach(c=>{if(c.collected)return;const x=sx(c.x),y=sy(c.y);rect(x,y,34,20,c.opened?'#172b37':'#b9e9f2');rect(x+4,y+4,26,11,c.opened?'#6eeeff':'#e75d55');rect(x+10,y-4,13,4,'#fff17a')});enemies.forEach(drawEnemy);if(boss){const x=sx(boss.x),y=sy(boss.y);rect(x,y+29,118,104,'#622b42');rect(x+14,y,76,39,'#9e4354');rect(x+25,y+12,12,8,'#fff17a');rect(x+61,y+12,12,8,'#fff17a');rect(x-20,y+52,38,20,'#a84945')}shots.forEach(s=>rect(sx(s.x),sy(s.y),s.w,s.h,s.type==='enemy'?'#ff5964':s.type==='homing'?'#fff17a':s.type==='laser'?'#bf75ff':'#63ebff'));drawPlayer();drawHUD()}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}
function tone(f,time,d,type,v){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,time);g.gain.exponentialRampToValueAtTime(.001,time+d);o.connect(g).connect(audioCtx.destination);o.start(time);o.stop(time+d)}function beep(f=460,d=.035,type='square',v=.025){if(musicOn&&audioCtx)tone(f,audioCtx.currentTime,d,type,v)}function startMusic(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();musicOn=true;noteIndex=0;clearInterval(musicTimer);musicTimer=setInterval(()=>{const l=curLevel(),now=audioCtx.currentTime;tone(l.melody[noteIndex%l.melody.length],now,.11,'square',.035);tone(l.melody[(noteIndex+2)%l.melody.length]*1.01,now+.02,.08,'square',.018);if(noteIndex%2===0)tone(l.bass[(noteIndex/2|0)%l.bass.length],now,.18,'triangle',.05);noteIndex++},135);document.getElementById('musicButton').textContent='音樂 ON'}function stopMusic(){musicOn=false;clearInterval(musicTimer);musicTimer=null;document.getElementById('musicButton').textContent='音樂 OFF'}
function togglePause(){if(!running)return;paused=!paused;document.getElementById('pauseOverlay').classList.toggle('hidden',!paused);if(!paused){last=0;requestAnimationFrame(loop)}}
document.getElementById('maleSelect').onclick=()=>{chosen='male';document.getElementById('chosenText').textContent='目前：REX。每個關卡都有不同平台、敵人節奏、補給箱與 8-bit 熱血旋律。'};document.getElementById('femaleSelect').onclick=()=>{chosen='female';document.getElementById('chosenText').textContent='目前：NOVA。每個關卡都有不同平台、敵人節奏、補給箱與 8-bit 熱血旋律。'};document.getElementById('unlockDebug').onclick=()=>{debugUnlocked=document.getElementById('creatorCode').value.trim()==='syouko';alert(debugUnlocked?'創作者除錯已解鎖：遊戲中按 G 切換無敵。':'代碼錯誤')};document.getElementById('musicButton').onclick=()=>musicOn?stopMusic():startMusic();document.getElementById('startButton').onclick=()=>{document.getElementById('menu').classList.add('hidden');document.getElementById('game').classList.remove('hidden');resetGame()};document.getElementById('restartButton').onclick=()=>{running=false;document.getElementById('game').classList.add('hidden');document.getElementById('menu').classList.remove('hidden')};addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(['arrowleft','arrowright','arrowup','arrowdown',' ','z','j','w','a','s','d','k'].includes(k))e.preventDefault();if((k==='w'||k==='arrowup'||k==='k')&&!e.repeat)jump();if([' ','z','j'].includes(k))shoot();if((k==='p'||k==='escape')&&!e.repeat)togglePause();if(k==='g'&&!e.repeat&&debugUnlocked){godMode=!godMode;beep(godMode?1200:220,.12,'square',.05)}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-hold]').forEach(b=>{const k=b.dataset.hold;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;if(k==='w')jump();if(k==='j')shoot()};b.onpointerup=b.onpointercancel=()=>keys[k]=false});document.querySelectorAll('[data-tap]').forEach(b=>b.onclick=()=>{if(b.dataset.tap==='jump')jump();if(b.dataset.tap==='shield'){player.weapon='防護罩';shoot()}if(b.dataset.tap==='pause')togglePause()});
</script>
